[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "modern-migration-accelerator-databricks"
version = "0.1.0"
description = "MVP Databricks accelerator for legacy migration metadata analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
]
local-spark = [
  "pyspark>=3.5",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.setuptools.packages.find]
where = ["src"]
