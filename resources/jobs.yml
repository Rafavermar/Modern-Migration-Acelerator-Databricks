resources:
  jobs:
    migration_accelerator:
      name: ${bundle.name}-${bundle.target}-accelerator
      description: Parse legacy metadata, build dependency graph, risk register, blueprint and DQ plan.
      max_concurrent_runs: 1
      job_clusters:
        - job_cluster_key: mvp_single_node
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            num_workers: 0
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*, 4]
            custom_tags:
              ResourceClass: SingleNode
      tasks:
        - task_key: parse_analyze_blueprint
          job_cluster_key: mvp_single_node
          spark_python_task:
            python_file: ../src/modern_migration_accelerator/pipelines/run_accelerator.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --source-root
              - ${var.source_root}

    target_demo:
      name: ${bundle.name}-${bundle.target}-target-demo
      description: Create a small target migration plan table from the generated blueprint.
      max_concurrent_runs: 1
      job_clusters:
        - job_cluster_key: mvp_single_node
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            num_workers: 0
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*, 4]
            custom_tags:
              ResourceClass: SingleNode
      tasks:
        - task_key: create_target_demo
          job_cluster_key: mvp_single_node
          spark_python_task:
            python_file: ../src/modern_migration_accelerator/pipelines/run_target_demo.py
            parameters:
              - --catalog
              - ${var.catalog}
