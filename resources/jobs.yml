resources:
  jobs:
    migration_accelerator:
      name: ${bundle.name}-${bundle.target}-accelerator
      description: Parse legacy metadata, build dependency graph, risk register, blueprint and DQ plan.
      max_concurrent_runs: 1
      tasks:
        - task_key: parse_analyze_blueprint
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 10000
          spark_python_task:
            python_file: dbfs:/Volumes/${var.catalog}/landing/legacy_metadata/runtime/run_accelerator.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --source-root
              - ${var.source_root}
      environments:
        - environment_key: default
          spec:
            environment_version: "2"

    target_demo:
      name: ${bundle.name}-${bundle.target}-target-demo
      description: Create a small target migration plan table from the generated blueprint.
      max_concurrent_runs: 1
      tasks:
        - task_key: create_target_demo
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 10000
          spark_python_task:
            python_file: dbfs:/Volumes/${var.catalog}/landing/legacy_metadata/runtime/run_target_demo.py
            parameters:
              - --catalog
              - ${var.catalog}
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
