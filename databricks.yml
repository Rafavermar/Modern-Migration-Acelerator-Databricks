bundle:
  name: modern_migration_accelerator_databricks

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog used for accelerator Delta outputs.
    default: migration_accelerator_dev
  source_root:
    description: Legacy metadata source folder. Defaults to demo metadata uploaded to a Unity Catalog volume.
    default: /Volumes/migration_accelerator_dev/landing/legacy_metadata/demo
  spark_version:
    description: Reserved for customer workspaces that replace serverless jobs with classic job clusters.
    default: 15.4.x-scala2.12
  node_type_id:
    description: Reserved for customer workspaces that replace serverless jobs with classic job clusters.
    default: Standard_DS3_v2

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
