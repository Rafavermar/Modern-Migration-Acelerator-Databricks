<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Modern Migration Accelerator for Databricks architecture cover</title>
  <desc id="desc">Architecture cover showing legacy metadata inputs, Databricks Asset Bundle, serverless assessment jobs, Delta outputs, Neo4j graph impact analysis, Vector Search, RAG, foundation model and MLflow evidence.</desc>
  <defs>
    <style>
      .title { font-family: "Arial Narrow", "Segoe UI Condensed", "Aptos Display", Arial, sans-serif; font-weight: 800; letter-spacing: 0; fill: #111827; }
      .label { font-family: "Segoe UI", Arial, sans-serif; font-weight: 700; fill: #111827; }
      .small { font-family: "Segoe UI", Arial, sans-serif; font-weight: 600; fill: #374151; }
      .tiny { font-family: "Segoe UI", Arial, sans-serif; font-weight: 500; fill: #4b5563; }
      .mono { font-family: "Cascadia Mono", Consolas, monospace; font-weight: 600; fill: #1f2937; }
      .muted { fill: #6b7280; }
      .red { fill: #ef3b2d; }
      .red-stroke { stroke: #ef3b2d; }
      .teal { fill: #009f9d; }
      .green { fill: #16a34a; }
      .amber { fill: #f59e0b; }
      .blue { fill: #2563eb; }
      .panel { fill: #ffffff; stroke: #9ca3af; stroke-width: 2; }
      .soft { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.6; }
      .line { stroke: #9ca3af; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #cbd5e1; stroke-width: 1.5; fill: none; stroke-linecap: round; }
      .chev { font-family: "Segoe UI", Arial, sans-serif; font-size: 34px; font-weight: 800; fill: #b6bec8; letter-spacing: -9px; }
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#9ca3af" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
    <g id="dbxMark">
      <path d="M0 18 42 0 84 18 42 36Z" fill="none" stroke="#ef3b2d" stroke-width="5" stroke-linejoin="round"/>
      <path d="M0 38 42 20 84 38 42 56Z" fill="none" stroke="#ef3b2d" stroke-width="5" stroke-linejoin="round"/>
      <path d="M0 58 42 40 84 58 42 76Z" fill="none" stroke="#ef3b2d" stroke-width="5" stroke-linejoin="round"/>
    </g>
    <g id="docIcon">
      <path d="M14 8h28l12 12v42H14Z" fill="#ffffff" stroke="#4b5563" stroke-width="3" stroke-linejoin="round"/>
      <path d="M42 8v14h12" fill="none" stroke="#4b5563" stroke-width="3" stroke-linejoin="round"/>
      <path d="M22 32h24M22 42h24M22 52h16" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="databaseIcon">
      <ellipse cx="32" cy="14" rx="24" ry="10" fill="#ffffff" stroke="#4b5563" stroke-width="3"/>
      <path d="M8 14v38c0 5.5 10.7 10 24 10s24-4.5 24-10V14" fill="#ffffff" stroke="#4b5563" stroke-width="3"/>
      <path d="M8 33c0 5.5 10.7 10 24 10s24-4.5 24-10" fill="none" stroke="#9ca3af" stroke-width="3"/>
      <path d="M8 50c0 5.5 10.7 10 24 10s24-4.5 24-10" fill="none" stroke="#9ca3af" stroke-width="3"/>
    </g>
    <g id="graphIcon">
      <circle cx="16" cy="18" r="8" fill="#ffffff" stroke="#009f9d" stroke-width="4"/>
      <circle cx="52" cy="14" r="8" fill="#ffffff" stroke="#009f9d" stroke-width="4"/>
      <circle cx="38" cy="52" r="8" fill="#ffffff" stroke="#009f9d" stroke-width="4"/>
      <path d="M24 18 44 14M20 26 34 45M48 22 41 44" stroke="#009f9d" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g id="searchIcon">
      <circle cx="27" cy="27" r="17" fill="#ffffff" stroke="#2563eb" stroke-width="5"/>
      <path d="M40 40 58 58" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g id="sparkIcon">
      <path d="M34 4 41 25 62 32 41 39 34 60 27 39 6 32 27 25Z" fill="#ffffff" stroke="#7c3aed" stroke-width="4" stroke-linejoin="round"/>
      <path d="M60 4 64 15 75 19 64 23 60 34 56 23 45 19 56 15Z" fill="#ffffff" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <g id="mlflowIcon">
      <path d="M27 7h22M34 7v20L16 57c-3 5 1 11 7 11h38c6 0 10-6 7-11L50 27V7" fill="#ffffff" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M25 49h34" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
      <circle cx="41" cy="59" r="3" fill="#f59e0b"/>
    </g>
    <g id="bundleIcon">
      <path d="M16 12h38l12 13v39H16Z" fill="#ffffff" stroke="#7c3aed" stroke-width="4" stroke-linejoin="round"/>
      <path d="M54 12v15h12" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linejoin="round"/>
      <path d="M28 31h23M28 43h27M28 55h18" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g id="checkIcon">
      <circle cx="34" cy="34" r="28" fill="#ffffff" stroke="#16a34a" stroke-width="5"/>
      <path d="M20 35 30 45 49 25" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="72" y="64" class="title" font-size="44">Modern Migration Accelerator for Databricks</text>
  <text x="75" y="103" class="small" font-size="19">Legacy metadata assessment | graph impact | semantic search | RAG evidence</text>

  <rect x="238" y="166" width="1040" height="650" rx="62" fill="#fffefe" stroke="#ef3b2d" stroke-width="2.5"/>
  <g transform="translate(738 116)">
    <rect x="-58" y="-18" width="176" height="82" rx="18" fill="#ffffff"/>
    <use href="#dbxMark" transform="scale(.52)"/>
    <text x="-55" y="61" class="title" font-size="32">databricks</text>
  </g>
  <text x="294" y="214" class="label red" font-size="24">Databricks assessment workbench</text>
  <text x="294" y="244" class="tiny" font-size="16">Declarative Automation Bundle + Unity Catalog + serverless workflows</text>

  <g transform="translate(40 192)">
    <text x="0" y="0" class="label" font-size="22">Legacy estate exports</text>
    <text x="0" y="26" class="tiny" font-size="14">Drop files into the landing volume</text>
    <rect x="-6" y="48" width="176" height="382" rx="22" fill="#ffffff" stroke="#009f9d" stroke-width="3"/>
    <g transform="translate(18 74)">
      <use href="#docIcon" transform="scale(.46)"/>
      <text x="40" y="23" class="small" font-size="16">ADF JSON</text>
    </g>
    <g transform="translate(18 128)">
      <use href="#databaseIcon" transform="scale(.46)"/>
      <text x="40" y="23" class="small" font-size="16">Synapse SQL</text>
    </g>
    <g transform="translate(18 184)">
      <use href="#databaseIcon" transform="scale(.46)"/>
      <text x="40" y="23" class="small" font-size="16">SQL Server</text>
    </g>
    <g transform="translate(18 240)">
      <use href="#docIcon" transform="scale(.46)"/>
      <text x="40" y="18" class="small" font-size="16">Notebooks</text>
      <text x="40" y="38" class="tiny" font-size="13">.ipynb, .sql</text>
    </g>
    <g transform="translate(18 303)">
      <use href="#docIcon" transform="scale(.46)"/>
      <text x="40" y="18" class="small" font-size="16">Docs</text>
      <text x="40" y="38" class="tiny" font-size="13">Lakebridge .xlsx</text>
    </g>
    <text x="152" y="468" class="chev">>>>></text>
  </g>

  <g transform="translate(62 660)">
    <circle cx="40" cy="22" r="30" fill="#111827"/>
    <path d="M27 22c0-8 6-14 14-14s14 6 14 14c0 6-4 11-9 13v8H36v-8c-5-2-9-7-9-13Z" fill="#ffffff"/>
    <text x="-8" y="72" class="label" font-size="16">GitHub</text>
    <text x="0" y="96" class="tiny" font-size="14">repo</text>
    <text x="104" y="34" class="chev">>>></text>
  </g>

  <g transform="translate(220 646)">
    <use href="#bundleIcon" transform="scale(.72)"/>
    <text x="-16" y="78" class="label" font-size="16">Asset Bundle</text>
    <text x="-14" y="101" class="mono" font-size="13">databricks.yml</text>
  </g>

  <g transform="translate(335 286)">
    <rect x="0" y="0" width="760" height="196" rx="36" class="panel" filter="url(#softShadow)"/>
    <text x="290" y="28" class="label" font-size="17">Serverless Databricks Jobs</text>
    <g transform="translate(48 64)">
      <use href="#databaseIcon" transform="scale(.56)"/>
      <text x="-18" y="82" class="label" font-size="15">Metadata</text>
      <text x="-8" y="102" class="tiny" font-size="13">landing volume</text>
    </g>
    <text x="142" y="110" class="chev">>>></text>
    <g transform="translate(205 70)">
      <use href="#docIcon" transform="scale(.56)"/>
      <text x="-18" y="76" class="label" font-size="15">Parse</text>
      <text x="-36" y="96" class="tiny" font-size="13">normalize assets</text>
    </g>
    <text x="308" y="110" class="chev">>>></text>
    <g transform="translate(376 70)">
      <path d="M35 5 64 64H6Z" fill="#ffffff" stroke="#ef3b2d" stroke-width="5" stroke-linejoin="round"/>
      <path d="M35 24v19M35 53v2" stroke="#ef3b2d" stroke-width="6" stroke-linecap="round"/>
      <text x="-27" y="76" class="label" font-size="15">Risk + priority</text>
      <text x="-18" y="96" class="tiny" font-size="13">scoring matrix</text>
    </g>
    <text x="483" y="110" class="chev">>>></text>
    <g transform="translate(550 70)">
      <use href="#checkIcon" transform="scale(.56)"/>
      <text x="-40" y="76" class="label" font-size="15">Blueprint + DQ</text>
      <text x="-28" y="96" class="tiny" font-size="13">target patterns</text>
    </g>
    <text x="653" y="110" class="chev">>>></text>
  </g>

  <g transform="translate(342 528)">
    <rect x="0" y="0" width="720" height="176" rx="18" class="soft"/>
    <text x="28" y="34" class="label red" font-size="21">Unity Catalog Delta outputs</text>
    <text x="28" y="64" class="mono" font-size="15">bronze.raw_documents</text>
    <text x="28" y="91" class="mono" font-size="15">silver.migration_assets</text>
    <text x="28" y="118" class="mono" font-size="15">gold.risk_register | gold.asset_priority_matrix</text>
    <text x="28" y="145" class="mono" font-size="15">gold.target_databricks_blueprint | gold.data_quality_plan</text>
    <g transform="translate(595 42)">
      <use href="#databaseIcon" transform="scale(.84)"/>
    </g>
  </g>

  <g transform="translate(1092 522)">
    <rect x="0" y="0" width="140" height="176" rx="20" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
    <use href="#graphIcon" transform="translate(36 22) scale(.9)"/>
    <text x="24" y="112" class="label" font-size="17">Neo4j</text>
    <text x="16" y="137" class="tiny" font-size="13">impact graph</text>
    <text x="19" y="156" class="tiny" font-size="13">Cypher queries</text>
  </g>

  <path d="M1062 614h30" class="line" marker-end="url(#arrow)"/>

  <g transform="translate(1125 250)">
    <rect x="0" y="0" width="120" height="160" rx="20" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <use href="#searchIcon" transform="translate(28 18) scale(.72)"/>
    <text x="14" y="95" class="label" font-size="16">Vector Search</text>
    <text x="19" y="121" class="tiny" font-size="12">endpoint</text>
    <text x="12" y="142" class="mono" font-size="11">mma-vector-search-dev</text>
  </g>

  <path d="M935 286c80-50 126-26 190 18" class="thin" marker-end="url(#arrow)"/>
  <path d="M910 528c90-30 150-10 213-106" class="thin" marker-end="url(#arrow)"/>

  <g transform="translate(1308 188)">
    <text x="0" y="0" class="label" font-size="22">Semantic RAG layer</text>
    <text x="0" y="28" class="tiny" font-size="14">Search, answer, audit</text>

    <rect x="-6" y="54" width="250" height="128" rx="24" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="22" y="86" class="label" font-size="17">Embedding model</text>
    <text x="22" y="114" class="mono" font-size="13">databricks-qwen3</text>
    <text x="22" y="136" class="mono" font-size="13">-embedding-0-6b</text>
    <text x="22" y="162" class="tiny" font-size="13">Delta Sync Vector Index</text>

    <rect x="-6" y="210" width="250" height="130" rx="24" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
    <use href="#sparkIcon" transform="translate(16 232) scale(.66)"/>
    <text x="88" y="244" class="label" font-size="17">Foundation Model</text>
    <text x="88" y="272" class="mono" font-size="13">databricks-gemma</text>
    <text x="88" y="294" class="mono" font-size="13">-3-12b</text>
    <text x="88" y="320" class="tiny" font-size="13">RAG answer generation</text>

    <rect x="-6" y="368" width="250" height="136" rx="24" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
    <use href="#mlflowIcon" transform="translate(16 389) scale(.66)"/>
    <text x="88" y="405" class="label" font-size="17">MLflow evidence</text>
    <text x="88" y="433" class="tiny" font-size="13">retrieval traces</text>
    <text x="88" y="455" class="tiny" font-size="13">generated answers</text>
    <text x="88" y="477" class="tiny" font-size="13">starter evaluation</text>
  </g>

  <path d="M1244 330h58" class="line" marker-end="url(#arrow)"/>
  <path d="M1430 370v26" class="thin" marker-end="url(#arrow)"/>
  <path d="M1430 528v26" class="thin" marker-end="url(#arrow)"/>

  <g transform="translate(284 736)">
    <text x="0" y="0" class="tiny" font-size="14">Assessment output, not automatic migration execution:</text>
    <text x="0" y="26" class="small" font-size="16">what exists, what depends on what, what is risky, what should migrate first, and which Databricks target pattern fits.</text>
  </g>
</svg>
