name: modern-migration-accelerator

services:
  legacy-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ${SQLSERVER_CONTAINER_NAME:-mma-legacy-sqlserver}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - legacy-sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >
          if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then SQLCMD=/opt/mssql-tools18/bin/sqlcmd;
          else SQLCMD=/opt/mssql-tools/bin/sqlcmd; fi;
          "$$SQLCMD" -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  legacy-sqlserver-data:
